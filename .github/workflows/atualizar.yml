name: Atualizar catálogo

on:
  schedule:
    - cron: "17 */6 * * *"     # a cada 6 horas
  workflow_dispatch:            # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]
    paths: ["site/**", "scraper/lojas.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coletar preços
        run: node scraper/scrape.mjs
        continue-on-error: true      # se falhar, o site segue com o último data.json bom
      - name: Salvar dados novos
        run: |
          git config user.name "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || (git commit -m "Atualiza preços" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
